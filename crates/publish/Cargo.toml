[package]
name = "yourdocs-publish"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
jiff = "0.2.38"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "sync", "fs", "macros", "process", "net"] }
tracing = "0.1.44"
yourdocs-core = { version = "0.0.0", path = "../core" }
yourdocs-render = { version = "0.0.0", path = "../render" }
yourdocs-store = { version = "0.0.0", path = "../store" }

[dev-dependencies]
axum = "0.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }
uuid = { version = "1.28.0", features = ["v7"] }
yourdocs-assets = { path = "../assets" }
