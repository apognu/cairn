[package]
name = "yourdocs-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1.12.1"
futures-util = "0.3.34"
jiff = "0.2.38"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
rust-embed = { version = "8", features = ["include-exclude", "mime-guess"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["v7"] }
yourdocs-assets = { version = "0.0.0", path = "../assets" }
yourdocs-auth = { version = "0.0.0", path = "../auth" }
yourdocs-core = { version = "0.0.0", path = "../core", features = ["openapi"] }
yourdocs-publish = { version = "0.0.0", path = "../publish" }
yourdocs-render = { path = "../render" }
yourdocs-store = { version = "0.0.0", path = "../store" }
