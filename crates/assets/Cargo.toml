[package]
name = "cairn-assets"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
imagesize = "0.15.0"
object_store = "0.14.2"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "macros"] }
webp = "0.3.1"
cairn-core = { version = "0.0.0", path = "../core" }

[dev-dependencies]
uuid = { version = "1.28.0", features = ["v7"] }
