[package]
name = "cairn-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["sync"] }
utoipa = { version = "6.0.0", optional = true }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[features]
# Derives OpenAPI schemas for the types the HTTP API exposes.
openapi = ["dep:utoipa"]

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
