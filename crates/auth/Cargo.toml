[package]
name = "yourdocs-auth"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
jiff = "0.2.38"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
tracing = "0.1"
uuid = "1.28.0"
yourdocs-core = { version = "0.0.0", path = "../core" }
yourdocs-store = { version = "0.0.0", path = "../store" }

[dev-dependencies]
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
