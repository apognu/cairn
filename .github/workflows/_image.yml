# Reusable: packages the binary from _binary.yml (same run) into the server image and pushes it to ghcr.io: `latest` from main, the
# version from a `v*` tag, and `sha-…` always. The caller grants `packages: write`.
name: image
on:
  workflow_call:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cairn-linux-amd64
          path: docker-bin
      # Artifacts do not keep file modes.
      - run: chmod +x docker-bin/cairn
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          # Stands in for the Dockerfile's `server` stage, so the binary built by _binary.yml is used and nothing is compiled again.
          build-contexts: server=docker-bin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
