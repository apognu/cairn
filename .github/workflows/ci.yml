name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      # Pagefind's launcher (used by the publish tests) and Playwright run on Node.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: cargo build -p cairn-cli
      # The sign-in tests (`serve.spec`) need a provider: a local Dex with one user.
      - run: docker run -d --network host -v "$PWD/examples/dex/config.yaml:/etc/dex/config.yaml:ro" ghcr.io/dexidp/dex:v2.41.1 dex serve /etc/dex/config.yaml
      - run: node packages/e2e/node_modules/.bin/playwright install --with-deps chromium
      - run: bun run --filter @cairn/e2e test

  # The same Rust tests with every test database on Postgres instead of SQLite (see `connect_for_tests`), which also runs the
  # migrations there. The end-to-end tests stay on SQLite: the server code is the same.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo test
