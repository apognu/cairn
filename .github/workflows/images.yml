name: images
# Publishes the builder and runtime images when a version is tagged: `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [builder, runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # Matching tags for the two images: the builder's output only fits the runtime of the same version.
          tags: |
            yourdocs/${{ matrix.target }}:${{ steps.version.outputs.tag }}
            yourdocs/${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
