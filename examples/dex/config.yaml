# A local OIDC provider for trying `yourdocs serve`: one user, alice@example.com, password "password".
issuer: http://127.0.0.1:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: yourdocs
    name: yourdocs
    secret: dev-secret
    redirectURIs:
      - http://127.0.0.1:8080/_editor/auth/callback
      - http://localhost:8080/_editor/auth/callback
      - https://localhost:8443/_editor/auth/callback

enablePasswordDB: true

staticPasswords:
  - email: alice@example.com
    # bcrypt of "password"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: alice
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
