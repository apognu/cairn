# A local OIDC provider for trying `cairn serve`: one user, alice@example.com, password "password".
issuer: http://127.0.0.1:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: cairn
    name: cairn
    secret: dev-secret
    redirectURIs:
      - http://127.0.0.1:8080/_editor/auth/callback
      - http://localhost:8080/_editor/auth/callback
      - http://127.0.0.1:3400/_editor/auth/callback
      - https://localhost:8443/_editor/auth/callback

enablePasswordDB: true

staticPasswords:
  - email: alice@example.com
    # bcrypt of "password"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: alice
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
  # A second editor, for the page lock and hotfix tests.
  - email: bob@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: bob
    userID: "5f0c1d9e-8a4b-4f0e-9b7a-2d6c3e1f4a80"
